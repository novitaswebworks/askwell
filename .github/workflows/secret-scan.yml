name: secret-scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the scanner as it is on the base branch, so a pull request cannot weaken its own check.
      # (The first pull request that adds the scanner has no base copy yet, so it uses its own.)
      - name: Fetch the scanner from the base branch
        run: git show "origin/${{ github.base_ref }}:scripts/scan-secrets.mjs" > "$RUNNER_TEMP/scan-secrets.mjs" || cp scripts/scan-secrets.mjs "$RUNNER_TEMP/scan-secrets.mjs"
      - run: node "$RUNNER_TEMP/scan-secrets.mjs" --self-test
      - run: node "$RUNNER_TEMP/scan-secrets.mjs" "origin/${{ github.base_ref }}"
