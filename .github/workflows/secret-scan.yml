name: secret-scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/scan-secrets.mjs --self-test
      - run: node scripts/scan-secrets.mjs "origin/${{ github.base_ref }}"
